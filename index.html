<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>QRキーワード</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap"><div class="panel"><div class="show" id="show"><span class="eyebrow">KEYWORD</span><p class="sub-t">読み込んでいます…</p></div></div></div>
<script src="crypto.js"></script>
<script>
const show = document.getElementById('show');
let config = null;
const view = (body) => { show.innerHTML = '<span class="eyebrow">KEYWORD</span>' + body; };
async function render() {
  const token = location.hash.slice(1);
  if (!token) return view('<p class="wait">QRコードを読み取ってください</p><div class="rule"></div><p class="sub-t">会場にあるQRコードを読み取ると、ここに単語が表示されます。</p>');
  if (!config) {
    try { config = await (await fetch('words.json', { cache: 'no-store' })).json(); }
    catch (e) { return view('<p class="wait ngt">読み込めませんでした</p><div class="rule"></div><p class="sub-t">通信状況を確認して、ページを読み込み直してください。</p>'); }
  }
  view('<p class="sub-t">読み込んでいます…</p>');
  const word = await MB.open(config, token);
  if (location.hash.slice(1) !== token) return;
  view(word === null
    ? '<p class="wait ngt">このQRコードは登録されていません</p><div class="rule"></div><p class="sub-t">読み取ったQRコードをもう一度確認してください。</p>'
    : `<p class="word flash">${MB.esc(word)}</p><div class="rule"></div>`);
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
